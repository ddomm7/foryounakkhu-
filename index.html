<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f5">
<title>សំបុត្រស្នេហ៍ 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="screen" id="s1" aria-label="បើកសំបុត្រអនុស្សាវរីយ៍">
  <p class="cap">សំបុត្រមួយសម្រាប់អូន…</p>
  <button id="env" type="button" aria-label="ចុចដើម្បីបើកសំបុត្រ" aria-pressed="false">
    <div class="back" aria-hidden="true"></div><div class="letter" aria-hidden="true"></div><div class="pocket" aria-hidden="true"></div><div class="flap" aria-hidden="true"></div><div class="seal" aria-hidden="true">♥</div>
  </button>
  <p class="cap hint">ចុចលើស្រោមសំបុត្រ</p>
</section>

<section class="screen" id="s2" aria-label="សំបុត្រ និងអនុស្សាវរីយ៍របស់យើង">
  <div class="paper">
    <h2 id="to"></h2>
    <p class="txt" id="txt" aria-live="polite"></p>
    <div class="sig" id="sig"></div>
  </div>
  <div id="count">
    <p class="cap" id="ttl">យើងនៅជាមួយគ្នាអស់រយៈពេល 💕</p>
    <div class="cells" aria-label="រយៈពេលដែលយើងបាននៅជាមួយគ្នា">
      <div class="cell"><b id="d">០</b><span>ថ្ងៃ</span></div>
      <div class="cell"><b id="h">០</b><span>ម៉ោង</span></div>
      <div class="cell"><b id="m">០</b><span>នាទី</span></div>
      <div class="cell"><b id="s">០</b><span>វិនាទី</span></div>
    </div>
    <div class="since"><small>ថ្ងៃដែលយើងចាប់ផ្តើម</small><span id="when"></span></div>
    <div class="gal" id="gal">
      <p class="cap">អនុស្សាវរីយ៍របស់យើង 📸</p>
      <div class="strip" id="strip"></div>
      <p class="swipe" id="swipe" hidden>អូសទៅឆ្វេង ដើម្បីមើលរូបផ្សេងទៀត 👉</p>
    </div>
  </div>
</section>


<div id="lb" role="dialog" aria-modal="true" aria-label="រូបថតអនុស្សាវរីយ៍" aria-hidden="true">
  <button class="lb-close" id="lbclose" type="button" aria-label="បិទ">×</button>
  <img alt="" id="lbimg"><p id="lbcap"></p>
</div>

<script src="script.js" defer></script>
</body>
</html>
